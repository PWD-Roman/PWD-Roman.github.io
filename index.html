<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Roman Del Angel — Portafolio (Terminal)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="terminal" role="application" aria-label="Terminal de Roman">
    <div class="term-header">
      <div class="dot close"></div>
      <div class="dot min"></div>
      <div class="dot max"></div>
      <div class="title">roman@arch • terminal</div>
    </div>

    <div id="output" aria-live="polite"></div>

    <div class="input-line" style="position:relative;">
      <div class="prompt" id="prompt">roman@arch:~$</div>
      <input id="cmd" class="input" autocomplete="off" autofocus spellcheck="false" />
      <div id="autocomplete"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
